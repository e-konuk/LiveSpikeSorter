# Builds LiveSpikeSorter.exe. On a v* tag, attaches the zip to a GitHub Release.
# On a pull request, or when run by hand (Actions tab -> Release -> Run workflow), it only
# uploads the zip as a build artifact. GitHub shows "Run workflow" only once this file is on
# the default branch, so test changes to it through a pull request.
#
# To release: set VERSION, commit, then `git tag v<VERSION>` and `git push origin v<VERSION>`.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match VERSION file ($version)"
          }

      # Only the CUDA 11.8 parts the build needs, plus cuDNN 8.9.7. Sets CUDA_PATH and CUDNN_PATH.
      - name: Install CUDA 11.8 and cuDNN 8.9.7
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"   # Invoke-WebRequest is very slow with the progress bar

          $cudaUrl  = "https://developer.download.nvidia.com/compute/cuda/11.8.0/network_installers/cuda_11.8.0_windows_network.exe"
          $cudnnUrl = "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/windows-x86_64/cudnn-windows-x86_64-8.9.7.29_cuda11-archive.zip"
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v11.8"
          $work     = Join-Path $env:RUNNER_TEMP "cuda"
          New-Item -ItemType Directory -Force $work | Out-Null

          # CUDA: compiler, the libraries the exe links, the headers it includes, and VS integration
          Invoke-WebRequest $cudaUrl -OutFile "$work\cuda.exe"
          $components = "nvcc", "cudart", "cublas", "cublas_dev", "cufft", "cufft_dev", "cusolver", "cusolver_dev",
                        "cusparse_dev", "npp", "npp_dev", "thrust", "visual_studio_integration" | ForEach-Object { "${_}_11.8" }
          Start-Process -Wait -FilePath "$work\cuda.exe" -ArgumentList (@("-s") + $components)
          if (-not (Test-Path "$cudaPath\bin\nvcc.exe")) { throw "CUDA install failed: nvcc.exe not found" }

          # The installer does not reliably register the CUDA build customizations with VS on runners
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Copy-Item "$cudaPath\extras\visual_studio_integration\MSBuildExtensions\*" `
                    "$vs\MSBuild\Microsoft\VC\v170\BuildCustomizations" -Force

          # cuDNN: NVIDIA's public redistributable archive (no login needed)
          Invoke-WebRequest $cudnnUrl -OutFile "$work\cudnn.zip"
          Expand-Archive "$work\cudnn.zip" -DestinationPath $work -Force
          $cudnnPath = Get-ChildItem $work -Directory -Filter "cudnn-windows-*" | Select-Object -First 1 -ExpandProperty FullName
          if (-not (Test-Path "$cudnnPath\include\cudnn.h")) { throw "cuDNN archive layout not recognized" }

          "CUDA_PATH=$cudaPath"   | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CUDNN_PATH=$cudnnPath" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
                       -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          # WindowsTargetPlatformVersion=10.0: use whichever Windows 10/11 SDK the runner has
          & $msbuild LiveSpikeSorter.sln /t:Build /p:Configuration=Release /p:Platform=x64 `
                     /p:WindowsTargetPlatformVersion=10.0 /m /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist\LiveSpikeSorter"
          New-Item -ItemType Directory -Force $dist | Out-Null
          # The exe and the SpikeGLX API DLL (with its MinGW runtime). The CUDA and cuDNN
          # DLLs come from the conda environment, see environment.yml.
          Copy-Item bin\build\LiveSpikeSorter.exe, `
                    bin\build\SglxApi.dll, `
                    bin\build\libgcc_s_seh-1.dll, `
                    bin\build\libstdc++-6.dll, `
                    bin\build\libwinpthread-1.dll, `
                    LICENSE $dist
          # No version in the name, so .../releases/latest/download/LiveSpikeSorter-win64.zip
          # always works; the version is in the tag and compiled into the exe.
          Compress-Archive "$dist\*" "dist\LiveSpikeSorter-win64.zip"
          "ZIP=dist\LiveSpikeSorter-win64.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: LiveSpikeSorter-win64
          path: ${{ env.ZIP }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$env:ZIP" --title "${{ github.ref_name }}" --generate-notes
