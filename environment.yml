# Live Spike Sorter (LSS) Python environment.
#
#   conda env create -f environment.yml
#   conda activate lss
#
# Update an existing environment after pulling:
#   conda env update -f environment.yml --prune
name: lss
channels:
  - conda-forge
dependencies:
  # kilosort 4.0.13 requires numpy<2, which has no wheels for Python 3.13+
  - python>=3.10,<3.13
  - numpy>=1.20,<2
  # kilosort 4.0.13 imports pkg_resources, which setuptools 81 removed
  - setuptools<81
  - pip
  - scipy
  - matplotlib
  - h5py
  - pyqt=5
  - qtpy
  - pyqtgraph>=0.13
  # CUDA runtime libraries for LiveSpikeSorter.exe (cuBLAS, cuFFT, cuSOLVER, NPP,
  # cuDNN). `conda activate lss` puts them on PATH, so no NVIDIA installer is
  # needed just to run LSS. cuda-version picks the CUDA 11 build of cuDNN.
  - cuda-version=11.8
  - cudatoolkit=11.8
  - cudnn=8.9.7
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.7.1+cu118
      # Stock Kilosort; LSS's training additions are in src/Python/lss_kilosort.py,
      # which is pinned to this exact version.
      - kilosort==4.0.13
      - spikeinterface
      - probeinterface
      # The `lss` command (see pyproject.toml)
      - -e .
